# AgentDesk on the demo laptop. One .env per service, copied from .env.example.
# `migrate` runs once and web and worker wait for it (spine: Migrations & tests).

name: agent-desk

# Every agent reads AGENT_PAYTO from .env.seed, which `pnpm seed` writes with
# the Platform Wallet address: nothing in .env can know that address until the
# seed has imported PLATFORM_WALLET_KEY. The file is optional so a fresh clone
# still comes up; an agent without AGENT_PAYTO exits naming the key.
x-agent-base: &agent-base
  build: { context: ., dockerfile: docker/Dockerfile.node }
  restart: unless-stopped
  env_file:
    - .env
    - { path: .env.seed, required: false }
  # `service_healthy`, not `service_started`: the x402 resource server fetches the
  # facilitator's supported kinds once while the agent boots and never retries, so
  # an agent that wins the race against the facilitator answers 500 to every paid
  # request for the rest of its life instead of 402.
  depends_on:
    facilitator: { condition: service_healthy }
  healthcheck:
    test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:' + process.env.AGENT_PORT + '/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
    interval: 3s
    timeout: 5s
    retries: 20

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentdesk
      POSTGRES_PASSWORD: agentdesk
      POSTGRES_DB: agentdesk
    ports: ['5432:5432']
    # postgres:18 stores its cluster under a version directory inside
    # /var/lib/postgresql and refuses to start when it finds a mount at the old
    # /var/lib/postgresql/data path (docker-library/postgres#1259).
    volumes: ['pgdata:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agentdesk -d agentdesk']
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: { context: ., dockerfile: docker/Dockerfile.node }
    command: ['pnpm', '--filter', '@agent-desk/db', 'migrate']
    env_file: [.env]
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  web:
    build: { context: ., dockerfile: docker/Dockerfile.web }
    restart: unless-stopped
    env_file: [.env]
    ports: ['3000:3000']
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 20

  worker:
    build: { context: ., dockerfile: docker/Dockerfile.node }
    command: ['pnpm', '--filter', '@agent-desk/worker', 'start']
    restart: unless-stopped
    env_file: [.env]
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  facilitator:
    build: { context: ., dockerfile: docker/Dockerfile.node }
    command: ['pnpm', '--filter', '@agent-desk/facilitator', 'start']
    restart: unless-stopped
    env_file: [.env]
    environment: { FACILITATOR_PORT: '4020' }
    ports: ['4020:4020']
    # 20 x 3s covers the story's "every /health answers 200 within 60 s". Alpine
    # has no curl, and `node -e` needs nothing that is not already in the image.
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4020/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 20

  agent-binance-ticker:
    <<: *agent-base
    command: ['pnpm', '--filter', '@agent-desk/agent-binance-ticker', 'start']
    environment: { AGENT_PORT: '4101', AGENT_PRICE: '0.01' }
    ports: ['4101:4101']

  agent-alpha-research:
    <<: *agent-base
    command: ['pnpm', '--filter', '@agent-desk/agent-alpha-research', 'start']
    environment: { AGENT_PORT: '4102', AGENT_PRICE: '0.05' }
    ports: ['4102:4102']

  agent-sloppy-research:
    <<: *agent-base
    command: ['pnpm', '--filter', '@agent-desk/agent-sloppy-research', 'start']
    environment: { AGENT_PORT: '4103', AGENT_PRICE: '0.03' }
    ports: ['4103:4103']

  agent-guardrail-risk:
    <<: *agent-base
    command: ['pnpm', '--filter', '@agent-desk/agent-guardrail-risk', 'start']
    environment: { AGENT_PORT: '4104', AGENT_PRICE: '0.02' }
    ports: ['4104:4104']

  agent-spot-executor:
    <<: *agent-base
    command: ['pnpm', '--filter', '@agent-desk/agent-spot-executor', 'start']
    environment: { AGENT_PORT: '4105', AGENT_PRICE: '0.01' }
    ports: ['4105:4105']

  agent-telegram-notifier:
    <<: *agent-base
    command: ['pnpm', '--filter', '@agent-desk/agent-telegram-notifier', 'start']
    environment: { AGENT_PORT: '4106', AGENT_PRICE: '0.005' }
    ports: ['4106:4106']

  # Story 2.3: a second Sloppy Research paid to the demo Creator wallet, so the
  # listing beat has a live endpoint. AGENT_PAYTO comes from .env.seed.
  agent-sloppy-research-2:
    <<: *agent-base
    command: ['pnpm', '--filter', '@agent-desk/agent-sloppy-research', 'start']
    environment: { AGENT_PORT: '4107', AGENT_PRICE: '0.03' }
    ports: ['4107:4107']

volumes:
  pgdata:
