[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
via_ir = false
fs_permissions = [{ access = "read-write", path = "./" }]

# BSC testnet (chain id 97). Verification uses the Etherscan V2 multichain API,
# which serves testnet.bscscan.com under the same key.
[rpc_endpoints]
bsc_testnet = "${RPC_URL}"

[etherscan]
bsc_testnet = { key = "${ETHERSCAN_API_KEY}", chain = 97, url = "https://api.etherscan.io/v2/api" }

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
